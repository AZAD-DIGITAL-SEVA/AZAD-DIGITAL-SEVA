<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Azad Miking Studio — AI Voice Generator</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0b0b10; color: #e8e8f0; line-height: 1.6; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
    header { padding: 1.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #a78bfa, #f0abfc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero { padding: 3rem 0 2rem; }
    .hero h1 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.03em; margin-bottom: 1rem; max-width: 750px; }
    .hero h1 .gradient { background: linear-gradient(135deg, #a78bfa, #f0abfc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 1.05rem; color: #a0a0b8; max-width: 620px; }
    .studio-app { background: #12121a; border: 1px solid rgba(255,255,255,0.07); border-radius: 24px; padding: 2rem; margin: 1.5rem 0 3rem; box-shadow: 0 20px 60px -25px rgba(124,58,237,0.35); }
    .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 800px) { .app-grid { grid-template-columns: 1fr; } .studio-app { padding: 1.5rem; } }
    .panel-title { font-size: 0.8rem; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #c084fc; margin-bottom: 0.8rem; }
    .script-input { width: 100%; min-height: 200px; background: #0b0b12; border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 1rem; color: #e8e8f0; font-family: inherit; font-size: 0.98rem; resize: vertical; outline: none; transition: border-color 0.2s; }
    .script-input:focus { border-color: rgba(168,85,247,0.5); }
    .script-input::placeholder { color: #5a5a70; }
    .char-count { font-size: 0.78rem; color: #787890; text-align: right; margin-top: 0.4rem; }
    .voice-list { display: grid; gap: 0.7rem; }
    .voice-option { display: flex; align-items: center; gap: 0.9rem; background: #0b0b12; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 0.85rem 1rem; cursor: pointer; transition: all 0.2s; }
    .voice-option:hover { border-color: rgba(168,85,247,0.4); }
    .voice-option.selected { border-color: #a855f7; background: rgba(168,85,247,0.1); }
    .voice-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .voice-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.1rem; }
    .voice-info p { font-size: 0.8rem; color: #9090a8; }
    .voice-check { margin-left: auto; color: #a855f7; font-weight: 700; opacity: 0; font-size: 1.1rem; }
    .voice-option.selected .voice-check { opacity: 1; }
    .btn { display: inline-block; padding: 0.9rem 2rem; border-radius: 100px; font-weight: 600; font-size: 1rem; text-decoration: none; transition: all 0.2s ease; cursor: pointer; border: none; font-family: inherit; }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; box-shadow: 0 4px 20px rgba(124,58,237,0.35); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124,58,237,0.5); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #1c1c28; color: #d0d0e0; border: 1px solid rgba(255,255,255,0.12); }
    .btn-secondary:hover { background: #252533; }
    .generate-wrap { margin-top: 1.5rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .output-box { margin-top: 1.5rem; background: #0b0b12; border: 1px solid rgba(168,85,247,0.25); border-radius: 16px; padding: 1.2rem; display: none; }
    .output-box.show { display: block; }
    .output-box h4 { font-size: 0.95rem; margin-bottom: 0.8rem; color: #d0d0e0; }
    audio { width: 100%; margin-bottom: 0.8rem; border-radius: 10px; }
    .output-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }
    .status-msg { font-size: 0.85rem; color: #c084fc; margin-top: 0.8rem; min-height: 1.2em; }
    footer { padding: 2rem 0; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; }
    footer p { color: #787890; font-size: 0.88rem; }
    .footer-brand { color: #a78bfa; font-weight: 600; }
</style>
</head>
<body>

<header>
    <div class="container header-inner">
        <div class="logo">Azad Miking Studio</div>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h1>Turn your script into<br /><span class="gradient">loudspeaker-ready audio</span><br />in seconds.</h1>
        <p>Paste your shop announcement, choose a voice, and generate professional miking audio instantly.</p>
    </div>
</section>

<div class="container" id="studio">
    <div class="studio-app">
        <div class="app-grid">
            <div>
                <div class="panel-title">1. Paste Your Script</div>
                <textarea id="scriptInput" class="script-input" placeholder="Example: আসসালামু আলাইকুম! আজ আমাদের দোকানে সব পণ্যে ৫০% ছাড়! আজই চলে আসুন..."></textarea>
                <div class="char-count"><span id="charCount">0</span> characters</div>
            </div>
            <div>
                <div class="panel-title">2. Choose a Voice</div>
                <div class="voice-list" id="voiceList"></div>
            </div>
        </div>

        <div class="generate-wrap">
            <button class="btn btn-primary" id="generateBtn" disabled>🎙️ Generate Audio</button>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <div class="output-box" id="outputBox">
            <h4>✅ Your Generated Audio</h4>
            <audio id="audioPlayer" controls></audio>
            <div class="output-actions">
                <button class="btn btn-primary" id="downloadBtn">⬇️ Download MP3</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="container">
        <p><span class="footer-brand">Azad Miking Studio</span> &copy; 2025</p>
    </div>
</footer>

<script>
/* ============================================================
   ⚠️ এখানে আপনার ElevenLabs API Key বসান (শুধু লোকাল টেস্টের জন্য)
   ============================================================ */
const ELEVENLABS_API_KEY = 'sk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; 

/* ============================================================
   ভয়েস মডেল (ElevenLabs Voice ID)
   ============================================================ */
const voices = [
    { id: 'JBFqnCBsd6RMkjVDRZzb', name: 'George', desc: 'Male • Narrative • Mature', emoji: '🧔', color: '#3b82f6' },
    { id: 'EXAVITQu4vr4xnSDxMaL', name: 'Sarah', desc: 'Female • Soft • Young', emoji: '👩', color: '#ec4899' },
    { id: 'onwK4e9ZLuTAKqWW03F9', name: 'Daniel', desc: 'Male • Authoritative • Mature', emoji: '👨‍🦳', color: '#10b981' },
    { id: 'XB0fDUnXU5powFXDhCwa', name: 'Charlotte', desc: 'Female • Conversational • Young', emoji: '👩‍🦰', color: '#f59e0b' }
];
/* নোট: উপরের ID গুলো ElevenLabs-এর ডিফল্ট ভয়েস [citation:2][citation:12]। আপনি নিজের কাস্টম ভয়েস ID দিয়ে বদলাতে পারেন। */

let selectedVoice = voices[0];
let generatedAudioUrl = null;

/* ============================================================
   UI রেন্ডার
   ============================================================ */
const voiceListEl = document.getElementById('voiceList');
const scriptInput = document.getElementById('scriptInput');
const charCount = document.getElementById('charCount');
const generateBtn = document.getElementById('generateBtn');
const statusMsg = document.getElementById('statusMsg');
const outputBox = document.getElementById('outputBox');
const audioPlayer = document.getElementById('audioPlayer');
const downloadBtn = document.getElementById('downloadBtn');

function renderVoices() {
    voiceListEl.innerHTML = '';
    voices.forEach(v => {
        const div = document.createElement('div');
        div.className = 'voice-option' + (v.id === selectedVoice.id ? ' selected' : '');
        div.innerHTML = `
            <div class="voice-avatar" style="background:${v.color}22; color:${v.color}">${v.emoji}</div>
            <div class="voice-info"><h4>${v.name}</h4><p>${v.desc}</p></div>
            <span class="voice-check">✓</span>
        `;
        div.addEventListener('click', () => { selectedVoice = v; renderVoices(); });
        voiceListEl.appendChild(div);
    });
}
renderVoices();

scriptInput.addEventListener('input', () => {
    charCount.textContent = scriptInput.value.length;
    generateBtn.disabled = scriptInput.value.trim().length === 0;
});

/* ============================================================
   ElevenLabs API কল
   ============================================================ */
async function generateWithElevenLabs(text, voiceId) {
    const url = `https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`;
    
    const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY
        },
        body: JSON.stringify({
            text: text,
            model_id: 'eleven_multilingual_v2', // বাংলা/হিন্দি সহ ২৯টি ভাষা সাপোর্ট [citation:2]
            voice_settings: {
                stability: 0.5,
                similarity_boost: 0.75,
                style: 0.0,
                use_speaker_boost: true
            }
        })
    });

    if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.detail?.message || `API error: ${response.status}`);
    }

    const audioBlob = await response.blob();
    return audioBlob;
}

/* ============================================================
   জেনারেট বাটন
   ============================================================ */
generateBtn.addEventListener('click', async () => {
    const text = scriptInput.value.trim();
    if (!text) return;

    if (ELEVENLABS_API_KEY.includes('xxxx')) {
        statusMsg.textContent = '⚠️ আগে কোডে আপনার ElevenLabs API Key বসান।';
        return;
    }

    generateBtn.disabled = true;
    statusMsg.textContent = `🎙️ Generating with ${selectedVoice.name}...`;
    outputBox.classList.remove('show');

    try {
        const blob = await generateWithElevenLabs(text, selectedVoice.id);
        
        if (generatedAudioUrl) URL.revokeObjectURL(generatedAudioUrl);
        generatedAudioUrl = URL.createObjectURL(blob);
        
        audioPlayer.src = generatedAudioUrl;
        outputBox.classList.add('show');
        statusMsg.textContent = `✅ Audio generated with ${selectedVoice.name}!`;
        
        // অটো প্লে
        audioPlayer.play().catch(() => {});
        
    } catch (err) {
        statusMsg.textContent = '❌ Error: ' + err.message;
        console.error(err);
    } finally {
        generateBtn.disabled = false;
    }
});

/* ============================================================
   ডাউনলোড
   ============================================================ */
downloadBtn.addEventListener('click', () => {
    if (!generatedAudioUrl) return;
    const a = document.createElement('a');
    a.href = generatedAudioUrl;
    a.download = `azad-miking-${selectedVoice.name.toLowerCase()}-${Date.now()}.mp3`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
});
</script>

</body>
</html>
